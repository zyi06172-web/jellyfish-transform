server {
  listen 80;
  server_name _;

  absolute_redirect off;

  root /usr/share/nginx/html;

  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    try_files $uri =404;
  }

  location = /assets {
    try_files /index.html =404;
  }
  location = /assets/ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
